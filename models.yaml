# =============================================================================
# Model catalog — single source of truth for all llm-server components.
#
# Every model has:
#   id            Internal key used by CLI (-Model), admin API, and MCP tools.
#   aliases       Friendly names (used by opencode, switch scripts, etc.).
#   label         Human-readable description shown in banners and status.
#   repo/file/include          HuggingFace GGUF download coordinates.
#   mmproj_repo/mmproj_file/mmproj_include   Vision projector download.
#   moe           Whether the model is Mixture-of-Experts.
#   context       Default KV context size (tokens).
#   kv_cache      Default KV cache quantization (q8_0, q4_0, f16).
#   load_flags    Extra llama-server flags for memory management.
#   output_limit  Suggested max output tokens (for client configs).
#
# To add a new model: add an entry here and run setup.ps1 -Model <id>.
# All scripts, the admin API, gateway, and MCP server pick it up automatically.
# =============================================================================

default_model: qwen36

models:
  qwen36:
    aliases: [big]
    label: "Qwen3.6-35B-A3B IQ4_XS (vision, MoE)"
    repo: "unsloth/Qwen3.6-35B-A3B-GGUF"
