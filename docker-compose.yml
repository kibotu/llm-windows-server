# =============================================================================
# llama.cpp LLM server - OpenAI-compatible API with token metering.
#
# Target box:  NVIDIA RTX 4080 16 GB  -  96 GB DDR5  -  Windows 11 + Docker (WSL2)
# Flagship:    Qwen3.6-35B-A3B (MoE) at IQ4_XS, experts offloaded to RAM (--cpu-moe).
#
# You normally don't edit this file. run.ps1 sets the env vars below and reconciles
# the container. Defaults here are the source of truth; override in .env if needed.
#
#   MODEL_FILE      GGUF filename in ./models/       (default: Qwen3.6 IQ4_XS)
#   MMPROJ_FLAGS    --mmproj flag for vision         (set by run.ps1 when present)
#   CONTEXT_SIZE    Total KV context tokens          (default: 262144)
#   N_PARALLEL      Concurrent request slots         (default: 1)
#                   (--kv-unified is always set so idle contexts are cached in
#                    RAM and restored instead of re-prefilled - helps agents that
#                    switch chats or fire auxiliary calls, e.g. OpenCode compaction)
#   KV_CACHE_TYPE   q8_0 | q4_0 | f16                (default: q8_0)
#   THREADS         CPU threads for experts/sampling (default: 10)
#   BATCH_SIZE      Physical batch -b                (default: 2048)
#   UBATCH_SIZE     Micro-batch -ub (== -b for MoE)  (default: 2048)
#   MOE_FLAGS       Expert offload strategy          (default: --cpu-moe)
#   REASONING       on | off - Qwen3 thinking mode   (default: on)
#                   (--reasoning-preserve is always set so reasoning stays in the
#                    prompt across turns - keeps the KV cache valid for agents)
#   EXTRA_LLAMA_FLAGS  Pass-through for extra flags
#   LLAMA_IMAGE     Pin a specific image/digest      (default: server-cuda13 tag)
#   LLAMA_API_KEY   Bearer key clients must present   (generated by setup.ps1)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # llm - llama.cpp HTTP server (GPU, MoE-aware). Never exposed directly;
  #       clients hit the gateway proxy on 8899.
  # ---------------------------------------------------------------------------
  llm:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda13}
    container_name: llm-server

    expose:
      - "8888"

    volumes:
      - ./models:/models:ro
      - ./logs:/logs

    # CUDA IPC + large GPU allocations on Windows/WSL2.
    shm_size: "2g"
    ipc: host

    # Keep model weights / KV cache off the page file (prevents mid-inference stalls).
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      # Cold load of a ~17 GB GGUF + CUDA kernel compile can take minutes on first start.
      start_period: 300s

      #--kv-unified
    command: >-
      -m /models/${MODEL_FILE:-Qwen3.6-35B-A3B-UD-IQ4_XS.gguf}
      ${MMPROJ_FLAGS:-}
      -c ${CONTEXT_SIZE:-262144}
      -ctk ${KV_CACHE_TYPE:-q8_0}
      -ctv ${KV_CACHE_TYPE:-q8_0}
      -ngl 99
      -t ${THREADS:-10}
      -b ${BATCH_SIZE:-2048}
      -ub ${UBATCH_SIZE:-2048}
      --host 0.0.0.0
      --port 8888
      --flash-attn on
      --parallel ${N_PARALLEL:-1}
      --cont-batching
      --reasoning ${REASONING:-on}
      --reasoning-preserve
      --jinja
      --metrics
      ${MOE_FLAGS:---cpu-moe}
      --no-mmap
      --mlock
      --numa distribute
      ${EXTRA_LLAMA_FLAGS:-}

  # ---------------------------------------------------------------------------
  # gateway - inference proxy on 8899: auth, token metering, MCP routing.
  # ---------------------------------------------------------------------------
  gateway:
    build: .
    container_name: llm-gateway

    ports:
      - "8899:8899"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Directory mount — binding a single file creates a directory if missing.
      - ./usage_data:/data:rw

    depends_on:
      llm:
        condition: service_healthy

    environment:
      - LLAMA_SERVER_URL=http://llm:8888
      # Bearer key clients must present. Generated by setup.ps1 into .env.
      # Empty = open server (no auth).
      - LLAMA_API_KEY=${LLAMA_API_KEY:-}
      # Admin key for MCP proxy authentication. Defaults to LLAMA_API_KEY.
      - LLAMA_ADMIN_KEY=${LLAMA_ADMIN_KEY:-}
      # Streamable-HTTP MCP server (mcp/server.py) on the host, reverse-proxied at /mcp.
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:8901}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/usage"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
