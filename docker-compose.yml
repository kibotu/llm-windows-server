# LLM service: llama.cpp HTTP server (CUDA). Tuning reference:
#   -m MODEL_FILE     Main GGUF path inside container (/models/...).
#   -c            CONTEXT_SIZE   Max context slots (tokens). Lower = less VRAM, faster prefill.
#   -ctk / -ctv   KV cache type for K/V tensors (q4_0 here: smaller KV, slight quality/speed tradeoff).
#   -ngl          GPU layers for main model (99 = all layers on GPU when supported).
#   -t            THREADS        CPU threads (prompt processing, sampling, ops not on GPU). See README.
#   -b            BATCH_SIZE     Physical batch; larger can raise throughput, uses more VRAM.
#   -ub           UBATCH_SIZE    Micro-batch; must be <= -b; often b/4–b/2.
#   --flash-attn  Flash attention (faster attention on supported GPUs).
#   --reasoning   REASONING      Extended reasoning mode when model/server supports it (on/off).
#   --jinja       Chat templates via Jinja (needed for Gemma and many instruct models).
#   --metrics     Expose Prometheus-style metrics endpoint.
#   SPECULATIVE_FLAGS (optional): draft model -md, -ngld, --draft-min, --draft-max (see README).
#   EXTRA_LLAMA_FLAGS (optional): pass-through for advanced llama-server flags.
# Env vars are set by run.ps1 or a root .env file; defaults below apply if unset.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llm-server
    expose:
      - "8888"
    volumes:
      - ./models:/models:ro
      - ./logs:/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    command: >-
      -m /models/${MODEL_FILE:-Qwen3.5-9B-Q4_K_M.gguf}
      -c ${CONTEXT_SIZE:-32768}
      -ctk q4_0
      -ctv q4_0
      -ngl 99
      -t ${THREADS:-20}
      -b ${BATCH_SIZE:-2048}
      -ub ${UBATCH_SIZE:-512}
      --host 0.0.0.0
      --port 8888
      --flash-attn on
      --reasoning ${REASONING:-off}
      --jinja
      --metrics
      ${SPECULATIVE_FLAGS:-}
      ${EXTRA_LLAMA_FLAGS:-}

  usage-tracker:
    build: .
    container_name: usage-tracker
    ports:
      - "8899:8899"
    volumes:
      - ./usage_data.json:/data/usage_data.json:rw
    depends_on:
      llm:
        condition: service_healthy
    environment:
      - LLAMA_SERVER_URL=http://llm:8888
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/usage"]
      interval: 10s
      timeout: 5s
      retries: 3