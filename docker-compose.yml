services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llm-server
    expose:
      - "8888"
    volumes:
      - ./models:/models:ro
      - ./logs:/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    command: >-
      -m /models/${MODEL_FILE:-Qwen3.5-9B-Q4_K_M.gguf}
      -c ${CONTEXT_SIZE:-32768}
      -ctk q4_0
      -ctv q4_0
      -ngl 99
      -b 2048
      -ub 512
      --host 0.0.0.0
      --port 8888
      --flash-attn on
      --reasoning ${REASONING:-off}
      --jinja
      --metrics

  usage-tracker:
    build: .
    container_name: usage-tracker
    ports:
      - "8899:8899"
    volumes:
      - ./usage_data.json:/data/usage_data.json:rw
    depends_on:
      llm:
        condition: service_healthy
    environment:
      - LLAMA_SERVER_URL=http://llm:8888
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/usage"]
      interval: 10s
      timeout: 5s
      retries: 3